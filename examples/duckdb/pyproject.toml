[project]
name = "dogana-example-store"
version = "0.6.0"
description = "An example dogana store on DuckDB and a file drop that feeds it; not published"
license = "Apache-2.0"
authors = [{ name = "Filippo Scotti" }]
requires-python = ">=3.11"
dependencies = ["dogana==0.6.0", "duckdb>=1.2", "pytz>=2024.1"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["example_store"]
