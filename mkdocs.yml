site_name: dogana
site_description: "A Python library for tables loaded from exports: it checks each delivered file against its manifest and contract, and keeps in a ledger what every delivery shows about the table"
site_url: https://fpiped.github.io/dogana/
repo_url: https://github.com/fpiped/dogana
repo_name: fpiped/dogana
edit_uri: edit/main/docs/
copyright: Licensed under Apache-2.0

theme:
  name: material
  # Zensical's classic variant keeps the Material look the colours were chosen for.
  variant: classic
  logo: assets/mascot.png
  favicon: assets/mascot.png
  custom_dir: overrides
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Concepts: concepts.md
  - Protocol: protocol.md
  - Reference: reference.md
  - Integrations: integrations.md
  - Architecture: architecture.md
  - Wire schemas: wire/README.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

validation:
  links:
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn
