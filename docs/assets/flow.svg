<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" role="img" aria-label="A delivery with its manifest passes the gate, the ledger records two dates per region, readers get claims">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6770"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="878" height="228" rx="18" fill="#f6f3ee" stroke="#e3ded6"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2a30">
    <rect x="30" y="60" width="180" height="92" rx="12" fill="#ffffff" stroke="#c9c2b8"/>
    <text x="120" y="96" text-anchor="middle" font-size="19" font-weight="600">delivery</text>
    <text x="120" y="122" text-anchor="middle" font-size="15" fill="#5b6770">rows plus a manifest:</text>
    <text x="120" y="141" text-anchor="middle" font-size="15" fill="#5b6770">what it is, as of when</text>

    <rect x="250" y="60" width="160" height="92" rx="12" fill="#ffffff" stroke="#c9c2b8"/>
    <text x="330" y="96" text-anchor="middle" font-size="19" font-weight="600">gate</text>
    <text x="330" y="122" text-anchor="middle" font-size="15" fill="#5b6770">checks the rows</text>
    <text x="330" y="141" text-anchor="middle" font-size="15" fill="#5b6770">against the claim</text>

    <rect x="450" y="60" width="190" height="92" rx="12" fill="#ffffff" stroke="#2f6f44" stroke-width="2"/>
    <text x="545" y="96" text-anchor="middle" font-size="19" font-weight="600">ledger</text>
    <text x="545" y="122" text-anchor="middle" font-size="15" fill="#5b6770">per region, two dates:</text>
    <text x="545" y="141" text-anchor="middle" font-size="15" fill="#5b6770">complete as of, valid as of</text>

    <rect x="680" y="60" width="170" height="92" rx="12" fill="#ffffff" stroke="#c9c2b8"/>
    <text x="765" y="96" text-anchor="middle" font-size="19" font-weight="600">claims</text>
    <text x="765" y="122" text-anchor="middle" font-size="15" fill="#5b6770">which rows to trust,</text>
    <text x="765" y="141" text-anchor="middle" font-size="15" fill="#5b6770">and since when</text>

    <line x1="210" y1="106" x2="248" y2="106" stroke="#5b6770" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="410" y1="106" x2="448" y2="106" stroke="#5b6770" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="640" y1="106" x2="678" y2="106" stroke="#5b6770" stroke-width="2" marker-end="url(#arrow)"/>

    <line x1="330" y1="152" x2="330" y2="186" stroke="#5b6770" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="330" y="208" text-anchor="middle" font-size="15" fill="#5b6770">receipt: accepted, rejected or replayed, with every check</text>
  </g>
</svg>
