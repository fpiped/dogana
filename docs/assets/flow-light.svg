<svg xmlns="http://www.w3.org/2000/svg" width="860" height="120" viewBox="0 0 860 120" role="img" aria-label="delivery, gate, ledger, claims">
    <line x1="100" y1="60" x2="760" y2="60" stroke="#c5cbd3" stroke-width="2"/>
  <circle cx="100" cy="60" r="7" fill="#1f2a30"/>
  <text x="100" y="36" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2a30">delivery</text>
  <text x="100" y="96" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#6b7480">rows plus a manifest</text>
  <circle cx="320" cy="60" r="7" fill="#1f2a30"/>
  <text x="320" y="36" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2a30">gate</text>
  <text x="320" y="96" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#6b7480">checks rows against the claim</text>
  <circle cx="540" cy="60" r="7" fill="#2f6f44"/>
  <text x="540" y="36" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#2f6f44">ledger</text>
  <text x="540" y="96" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#6b7480">two dates per region</text>
  <circle cx="760" cy="60" r="7" fill="#1f2a30"/>
  <text x="760" y="36" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2a30">claims</text>
  <text x="760" y="96" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#6b7480">which rows to trust, since when</text>
</svg>
