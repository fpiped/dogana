name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv && uv pip install -e . -e examples/duckdb --group dev
      - run: .venv/bin/python -m pytest -q
      - run: uvx ruff check . && uvx ruff format --check .
      - run: .venv/bin/python -m mypy --strict src examples/duckdb
