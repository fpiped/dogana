name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv && uv pip install -e . -e examples/duckdb --group dev
      # The coverage floor is measured once, where sys.monitoring makes tracing nearly free.
      - if: matrix.python == '3.14'
        run: COVERAGE_CORE=sysmon .venv/bin/coverage run -m pytest -q && .venv/bin/coverage report
      - if: matrix.python != '3.14'
        run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python scripts/traceability.py --strict
      - run: uvx ruff check . && uvx ruff format --check .
      - run: .venv/bin/python -m mypy --strict src examples/duckdb scripts/traceability.py

  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vale
        run: |
          curl --fail --location --retry 3 https://github.com/errata-ai/vale/releases/download/v3.25.1/vale_3.25.1_Linux_64-bit.tar.gz | tar -xz -C "$RUNNER_TEMP" vale
      - name: Check prose
        run: >-
          "$RUNNER_TEMP/vale" --minAlertLevel=error
          README.md CHANGELOG.md CONTRIBUTING.md AGENTS.md docs/*.md
          docs/wire/README.md src/dogana/.agents/skills/dogana/SKILL.md
