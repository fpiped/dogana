[project]
name = "dogana"
version = "0.0.1"
description = "Delivery contracts and arrival state for data integrations: know where absence means deletion"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Filippo Scotti" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["data-integration", "data-contract", "incremental-loading", "completeness", "ingestion"]

[project.optional-dependencies]
dev = ["pytest>=8"]
duckdb = ["duckdb>=1.1,<2"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
