[project]
name = "dogana"
version = "0.7.1"
description = "A Python library that tracks which rows of a table loaded from another system you can trust, and as of when"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Filippo Scotti" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["data-integration", "data-contract", "incremental-loading", "completeness", "ingestion", "deletions"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

[project.scripts]
dogana = "dogana.cli:main"

[project.urls]
Homepage = "https://github.com/fpiped/dogana"
Repository = "https://github.com/fpiped/dogana"
Changelog = "https://github.com/fpiped/dogana/blob/main/CHANGELOG.md"
Issues = "https://github.com/fpiped/dogana/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "coverage>=7",
  "mypy>=1.11",
  "hypothesis>=6",
  "hypothesis-jsonschema>=0.23.2",
  "jsonschema>=4.18",
  "types-jsonschema>=4",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dogana = ["py.typed", ".agents/skills/dogana/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["protocol(*ids): protocol rules exercised by this test (see scripts/traceability.py --list)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["src/dogana"]

[tool.coverage.report]
fail_under = 97
exclude_also = ["assert_never", "if TYPE_CHECKING:"]
